# CLA Assistant Lite: on a contributor's first pull request, asks them to
# accept CLA.md by posting a comment. Signatures are committed to the
# unprotected branch "cla-signatures" (created by the action on first use).
# The workflow never checks out or runs the pull request's code.
name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # v2.6.1, pinned to its commit
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/BlackDuckyGB/MyBuoy/blob/main/CLA.md"
          branch: "cla-signatures"
          allowlist: "BlackDuckyGB,bot*"
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-notsigned-prcomment: >-
            Thank you for your contribution! Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/BlackDuckyGB/MyBuoy/blob/main/CLA.md)
            and sign it: scroll down to the **Add a comment** box at the bottom of this
            **Conversation** tab, paste the sentence below **exactly** (nothing before or
            after it, no final period), then click **Comment**. Do not use Quote reply,
            and do not comment on a line of code (Files changed tab or Review changes
            button): those comments do not count. You only need to do this once.
